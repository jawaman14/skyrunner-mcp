name: MCP tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . build
      - run: python tests/test_guards.py src/skyrunner_mcp/server.py
      - run: python tests/test_runtime.py
      - run: python tests/test_collaboration.py
      - run: python tests/test_github_collab.py
      - run: python tests/test_local_llm.py
      - run: python tests/test_log_digest.py
      - run: python -m build
